name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.docsfilter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
      # The files the docs-check workflow lints and link-checks, so the docs
      # gate skips (and ok stays green) on PRs that touch none of them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docsfilter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    uses: anolishq/.github/.github/workflows/docs-check.yml@0199b6cc7cb73a02d58f75ec8ed763ac40e54dca # v2

  frontend:
    name: Frontend (Node / Vite build)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Playwright's image carries the browsers and the system packages they
    # need, so the smoke test no longer waits on `playwright install
    # --with-deps`, whose apt downloads from the Ubuntu archive ran past this
    # job's timeout (#544). Its version must be @playwright/test's in
    # frontend/package-lock.json: tests/unit/test_ci_playwright_image.py
    # checks it, and Renovate moves both in one PR. --user 1001 is the
    # runner's uid, which Firefox needs to own HOME.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:d89d0e4a7058330a8334306a5aef1e00807863d31af27cf11348eed696d6e0ba
      options: --user 1001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Check formatting
        run: npm run format:check
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check (svelte-check)
        run: npm run check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Report bundle size
        run: npm run bundle:size
        working-directory: frontend

      - name: Browser smoke test
        run: npm run smoke
        working-directory: frontend

  lint:
    name: Lint (ruff)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy anolis_workbench tests scripts/provider_locks.py

  test:
    name: Unit tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend unit tests (Vitest coverage)
        run: npm run test:unit:coverage
        working-directory: frontend

      - name: Run frontend component tests (Vitest coverage)
        run: npm run test:components:coverage
        working-directory: frontend

      - name: Build frontend (required by Python integration tests)
        run: npm run build
        working-directory: frontend

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Validate composer-control OpenAPI
        run: uv run python contracts/validate-composer-control-openapi.py

      - name: Validate workbench-api OpenAPI
        run: uv run python contracts/validate-workbench-api-openapi.py

  contract-drift:
    name: Contract drift check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Verify runtime-config schema lock
        run: python3 scripts/verify-upstream-schema.py --schema runtime-config --require-release-artifact

      - name: Verify machine-profile schema lock
        run: python3 scripts/verify-upstream-schema.py --schema machine-profile --require-release-artifact

      - name: Verify runtime-http OpenAPI lock
        run: python3 scripts/verify-upstream-schema.py --schema runtime-http --require-release-artifact

      # Discovers every lock under contracts/upstream/providers/, so adding a
      # provider needs no edit here (#285), and checks the registry invariants:
      # locks and vendored envelopes correspond 1:1, and each lock agrees with
      # the envelope it vendored.
      - name: Verify provider config-schema locks
        run: python3 scripts/verify-upstream-schema.py --all-providers --require-release-artifact

  freeze-smoke:
    name: Freeze smoke test (Linux)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install freeze dependencies
        # Locked, matching the `test` lane — so freeze-smoke resolves the same
        # pinned versions instead of floating within the pyproject ranges (which
        # made this lane non-deterministic under the deprecation guard). See #180.
        run: uv sync --locked --extra dev --extra ssh

      - name: Freeze sidecar
        run: |
          uv run python scripts/freeze_server.py \
            --name anolis-workbench \
            --output-dir dist \
            --min-size-bytes 10000000

      - name: Verify frozen executable runs
        run: |
          set -euo pipefail
          timeout 10 dist/anolis-workbench --version
          timeout 10 dist/anolis-workbench --help

      - name: Health-check the frozen sidecar
        run: |
          set -euo pipefail
          ANOLIS_WORKBENCH_SIDECAR_BIN="$PWD/dist/anolis-workbench" \
            uv run python -m pytest tests/integration/test_sidecar_health.py -v

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@0199b6cc7cb73a02d58f75ec8ed763ac40e54dca # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  desktop:
    name: Desktop (Rust / Tauri)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri

      # These packages come from the same Ubuntu archive whose downloads ran
      # past the job's timeout (#544). Keep the .debs apt fetched between
      # runs: apt reuses each one whose version still matches and downloads
      # only the rest. Saved right after the install, so a later failing step
      # does not lose it; an older cache still seeds a changed workflow.
      - name: Restore Tauri .deb cache
        id: tauri-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tauri-debs
          key: tauri-debs-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: tauri-debs-${{ runner.os }}-

      - name: Install Linux Tauri dependencies
        run: |
          set -euo pipefail
          mkdir -p ~/tauri-debs
          echo "cached .debs: $(find ~/tauri-debs -name '*.deb' | wc -l)"
          find ~/tauri-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/tauri-debs/ {} +

      - name: Save Tauri .deb cache
        if: steps.tauri-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tauri-debs
          key: tauri-debs-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # tauri-build's build script validates that every `externalBin`
      # (the frozen Python sidecar) exists for the host target triple, even
      # under `cargo check`/`clippy`. The real sidecar is only produced by the
      # release pipeline, so stage an empty placeholder to satisfy the
      # existence check in this lint-only lane (it is never bundled or run).
      - name: Stage placeholder sidecar for tauri-build
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          touch "binaries/anolis-workbench-sidecar-${triple}"
        working-directory: desktop/src-tauri

      - name: Check formatting
        run: cargo fmt --check
        working-directory: desktop/src-tauri

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: desktop/src-tauri

      - name: Check
        run: cargo check
        working-directory: desktop/src-tauri

  ok:
    name: ok
    if: always()
    needs: [changes, docs, frontend, lint, typecheck, test, contract-drift, freeze-smoke, version-sync, desktop]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
